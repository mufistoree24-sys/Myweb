/* ==========================================================================
   GAS STATIONS
   ========================================================================== */
function createGasStations() {
  var blocks = [[1,1],[3,1],[1,3],[3,3]];
  var shopColor = 0xe8e0c8;

  for (var k = 0; k < blocks.length; k++) {
    var bi = blocks[k][0], bj = blocks[k][1];
    var x1 = ROAD_POS[bi] + SW_OFF + 1;
    var x2 = ROAD_POS[bi+1] - SW_OFF - 1;
    var z1 = ROAD_POS[bj] + SW_OFF + 1;
    var z2 = ROAD_POS[bj+1] - SW_OFF - 1;
    var cx = (x1+x2)/2, cz = (z1+z2)/2;
    var bw = x2-x1, bd = z2-z1;

    // Asphalt pad
    var pad = new THREE.Mesh(new THREE.PlaneGeometry(bw, bd), MAT.asphalt);
    pad.rotation.x = -Math.PI/2;
    pad.position.set(cx, 0.052, cz);
    scene.add(pad);

    // Shop building
    var shopMat = new THREE.MeshStandardMaterial({ color: shopColor, roughness: 0.8 });
    var shopW = 8, shopD = 6;
    var shop = new THREE.Mesh(new THREE.BoxGeometry(shopW, 3.5, shopD), shopMat);
    shop.position.set(cx - bw*0.25, 1.75, cz + bd*0.3);
    shop.castShadow = true;
    scene.add(shop);

    // Shop windows
    var shopGlass = new THREE.Mesh(new THREE.BoxGeometry(shopW*0.7, 1.8, 0.1), MAT.glass);
    shopGlass.position.set(cx - bw*0.25, 1.8, cz + bd*0.3 + shopD/2 + 0.02);
    scene.add(shopGlass);

    // Shop door
    var shopDoor = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.2, metalness: 0.4 }));
    shopDoor.position.set(cx - bw*0.25, 1.1, cz + bd*0.3 + shopD/2 + 0.04);
    scene.add(shopDoor);

    var shopRoof = new THREE.Mesh(new THREE.BoxGeometry(shopW+0.5, 0.4, shopD+0.5),
      new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.7 }));
    shopRoof.position.set(cx - bw*0.25, 3.7, cz + bd*0.3);
    scene.add(shopRoof);

    // Fuel sign on shop
    var sign = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800, emissiveIntensity: 0.5 }));
    sign.position.set(cx - bw*0.25, 4.3, cz + bd*0.3 + shopD/2 + 0.05);
    scene.add(sign);

    // Canopy
    var canopyZ = cz - bd*0.15;
    var canopy = new THREE.Mesh(new THREE.BoxGeometry(bw*0.7, 0.5, 9),
      new THREE.MeshStandardMaterial({ color: 0xdd2222, roughness: 0.6 }));
    canopy.position.set(cx, 4.6, canopyZ);
    scene.add(canopy);

    var canopyLight = new THREE.Mesh(new THREE.BoxGeometry(bw*0.65, 0.05, 8.5),
      new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffddaa, emissiveIntensity: 0.4 }));
    canopyLight.position.set(cx, 4.32, canopyZ);
    scene.add(canopyLight);

    // Pillars
    var pillarMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
    for (var px = -1; px <= 1; px += 2) {
      for (var pz = -1; pz <= 1; pz += 2) {
        var pillar = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4.6, 0.4), pillarMat);
        pillar.position.set(cx + px * (bw*0.35), 2.3, canopyZ + pz * 4);
        scene.add(pillar);
      }
    }

    // Dispensers (2 pumps)
    for (var dx = -1; dx <= 1; dx += 2) {
      var dX = cx + dx * 3.5;
      var dZ = canopyZ;

      // Base
      var base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 1.4),
        new THREE.MeshStandardMaterial({ color: 0x555555 }));
      base.position.set(dX, 0.15, dZ);
      scene.add(base);

      // Body
      var dispBody = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.6, 0.9),
        new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 }));
      dispBody.position.set(dX, 1, dZ);
      scene.add(dispBody);

      // Screen
      var screen = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x004400, emissiveIntensity: 0.6 }));
      screen.position.set(dX, 1.4, dZ + 0.46);
      scene.add(screen);

      // Top
      var dispTop = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, 1),
        new THREE.MeshStandardMaterial({ color: 0x333333 }));
      dispTop.position.set(dX, 1.95, dZ);
      scene.add(dispTop);

      // Nozzle
      var nozzle = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, 0.15),
        new THREE.MeshStandardMaterial({ color: 0x222222 }));
      nozzle.position.set(dX + 0.5, 1.2, dZ);
      scene.add(nozzle);

      gasStations.push({ x: dX, z: dZ, radius: 5 });
    }
  }
}

/* ==========================================================================
   TRAFFIC LIGHTS
   ========================================================================== */
function createTrafficLights() {
  var poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });

  for (var i = 0; i < ROAD_POS.length; i++) {
    for (var j = 0; j < ROAD_POS.length; j++) {
      var x = ROAD_POS[i], z = ROAD_POS[j];
      var corners = [[-1,-1, 0], [1,-1, Math.PI/2], [1,1, Math.PI], [-1,1, -Math.PI/2]];
      for (var c = 0; c < 4; c++) {
        var sx = corners[c][0], sz = corners[c][1];
        var rot = corners[c][2];
        var lx = x + sx * (HR + 1.2);
        var lz = z + sz * (HR + 1.2);

        var g = new THREE.Group();
        g.position.set(lx, 0, lz);
        g.rotation.y = rot;

        var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 4.8, 6), poleMat);
        pole.position.y = 2.4;
        g.add(pole);

        var house = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.8, 0.35), poleMat);
        house.position.set(0, 4.3, 0.4);
        g.add(house);

        var redLight = new THREE.Mesh(new THREE.CircleGeometry(0.19, 14),
          new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff0000, emissiveIntensity: 0.0 }));
        redLight.position.set(0, 4.85, 0.61);
        g.add(redLight);

        var yellowLight = new THREE.Mesh(new THREE.CircleGeometry(0.19, 14),
          new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.0 }));
        yellowLight.position.set(0, 4.3, 0.61);
        g.add(yellowLight);

        var greenLight = new THREE.Mesh(new THREE.CircleGeometry(0.19, 14),
          new THREE.MeshStandardMaterial({ color: 0x22ff44, emissive: 0x00ff22, emissiveIntensity: 0.0 }));
        greenLight.position.set(0, 3.75, 0.61);
        g.add(greenLight);

        scene.add(g);
        trafficLights.push({
          dir: (c === 0 || c === 2) ? 'x' : 'z',
          red: redLight, yellow: yellowLight, green: greenLight
        });
      }
    }
  }
}

function updateTrafficLights() {
  // Day cycle: 22 min cycle
  var t = worldTime % 1;
  // Map so X is green 0-0.33, Z is green 0.5-0.83
  var xState, zState;
  if (t < 0.30) { xState = 'green'; zState = 'red'; }
  else if (t < 0.34) { xState = 'yellow'; zState = 'red'; }
  else if (t < 0.46) { xState = 'red'; zState = 'red'; }
  else if (t < 0.76) { xState = 'red'; zState = 'green'; }
  else if (t < 0.80) { xState = 'red'; zState = 'yellow'; }
  else { xState = 'red'; zState = 'red'; }

  for (var i = 0; i < trafficLights.length; i++) {
    var tl = trafficLights[i];
    var state = tl.dir === 'x' ? xState : zState;
    tl.red.material.emissiveIntensity = state === 'red' ? 1.2 : 0.0;
    tl.red.material.color.setHex(state === 'red' ? 0xff2222 : 0x552222);
    tl.yellow.material.emissiveIntensity = state === 'yellow' ? 1.2 : 0.0;
    tl.yellow.material.color.setHex(state === 'yellow' ? 0xffcc00 : 0x554400);
    tl.green.material.emissiveIntensity = state === 'green' ? 1.2 : 0.0;
    tl.green.material.color.setHex(state === 'green' ? 0x22ff44 : 0x225522);
  }
}

function getLightForDir(dir) {
  var t = worldTime % 1;
  if (dir === 'x') {
    if (t < 0.30) return 'green';
    if (t < 0.34) return 'yellow';
    return 'red';
  } else {
    if (t < 0.46) return 'red';
    if (t < 0.76) return 'green';
    if (t < 0.80) return 'yellow';
    return 'red';
  }
}

/* ==========================================================================
   PLAYER CAR
   ========================================================================== */
function setupPlayer() {
  rebuildPlayerCar();
  player.pos.set(-60, 0.05, 3);
  player.angle = Math.PI/2;
  playerCar.group.position.copy(player.pos);
  playerCar.group.rotation.y = player.angle;
  scene.add(playerCar.group);
}

function rebuildPlayerCar() {
  if (playerCar) scene.remove(playerCar.group);
  playerCar = buildCarMesh({
    type: player.type,
    color: player.colorHex,
    rimStyle: player.rimStyle,
    spoiler: player.spoiler
  });
  playerCar.group.position.copy(player.pos);
  playerCar.group.rotation.y = player.angle;
  player.length = playerCar.length;
  player.width = playerCar.width;
  scene.add(playerCar.group);
}

function updatePlayer(dt) {
  if (!playerCar) return;

  var maxSpeed = 20 + player.engineLevel * 3;
  var accel = 9 + player.engineLevel * 1.5;
  var brakeDecel = 22;
  var friction = 4.5;
  var hasFuel = player.fuel > 0;

  if (input.gas && hasFuel && !refueling) player.speed += accel * dt;
  if (input.brake && !refueling) player.speed -= brakeDecel * dt;
  if (!input.gas && !input.brake) {
    if (player.speed > 0) player.speed = Math.max(0, player.speed - friction * dt);
    else if (player.speed < 0) player.speed = Math.min(0, player.speed + friction * dt);
  }

  player.speed = clamp(player.speed, -maxSpeed*0.4, maxSpeed);
  if (Math.abs(player.speed) < 0.05 && !input.gas && !input.brake) player.speed = 0;

  // Steering
  var steerTarget = 0;
  if (input.left) steerTarget -= 1;
  if (input.right) steerTarget += 1;
  player.steer += (steerTarget - player.steer) * Math.min(1, 10 * dt);

  if (Math.abs(player.speed) > 0.2) {
    var speedFactor = clamp(Math.abs(player.speed) / 6, 0, 1);
    var turnAmount = player.steer * 1.7 * speedFactor * Math.sign(player.speed);
    player.angle -= turnAmount * dt;
  }

  var fx = Math.sin(player.angle);
  var fz = Math.cos(player.angle);
  var newX = player.pos.x + fx * player.speed * dt;
  var newZ = player.pos.z + fz * player.speed * dt;

  // Collision: buildings
  if (!checkBuildingCollision(newX, newZ, player.radius)) {
    player.pos.x = newX;
    player.pos.z = newZ;
  } else {
    // Slide along: try X only
    var colX = checkBuildingCollision(newX, player.pos.z, player.radius);
    var colZ = checkBuildingCollision(player.pos.x, newZ, player.radius);
    if (!colX) player.pos.x = newX;
    else if (!colZ) player.pos.z = newZ;
    player.speed *= 0.35;
    if (Math.abs(player.speed) > 5) triggerCameraShake(0.4);
  }

  // World bounds
  var b = WORLD_EXT + 15;
  player.pos.x = clamp(player.pos.x, -b, b);
  player.pos.z = clamp(player.pos.z, -b, b);

  // Collision: NPC cars (circle-based, resolves push)
  for (var i = 0; i < npcCars.length; i++) {
    var nc = npcCars[i];
    var dx = player.pos.x - nc.pos.x;
    var dz = player.pos.z - nc.pos.z;
    var rSum = player.radius + 2.0;
    var dd = dx*dx + dz*dz;
    if (dd < rSum*rSum && dd > 0.01) {
      var dist = Math.sqrt(dd);
      var nx = dx / dist, nz = dz / dist;
      var overlap = rSum - dist;
      player.pos.x += nx * overlap * 0.7;
      player.pos.z += nz * overlap * 0.7;
      nc.pos.x -= nx * overlap * 0.3;
      nc.pos.z -= nz * overlap * 0.3;
      player.speed *= 0.6;
      if (Math.abs(player.speed) > 3) triggerCameraShake(0.3);
    }
  }

  // Collision: pedestrians
  for (var j = 0; j < pedestrians.length; j++) {
    var ped = pedestrians[j];
    if (ped.state !== 'WALK' && ped.state !== 'WAIT' && ped.state !== 'CROSS') continue;
    var pdx = player.pos.x - ped.x;
    var pdz = player.pos.z - ped.z;
    var pdd = pdx*pdx + pdz*pdz;
    if (pdd < 2.6*2.6 && Math.abs(player.speed) > 3) {
      ped.state = 'FALL';
      ped.stateTime = 0;
      ped.hitSpeed = Math.abs(player.speed);
      if (Math.abs(player.speed) > 5) triggerCameraShake(0.25);
    }
  }

  // Apply
  playerCar.group.position.x = player.pos.x;
  playerCar.group.position.z = player.pos.z;
  playerCar.group.position.y = 0.05;
  playerCar.group.rotation.y = player.angle;

  // Steering wheels + spin
  var steerVisual = -player.steer * 0.5;
  var wheelSpin = player.speed * dt * 2;

  for (var k = 0; k < playerCar.steerWheels.length; k++) {
    playerCar.steerWheels[k].rotation.y = steerVisual;
  }
  for (var w = 0; w < playerCar.wheels.length; w++) {
    // The wheel group has rotation.y for steering, so spin around local X (which becomes a spinning motion)
    // We'll just rotate children meshes. Simpler: rotate group's children.
    var wg = playerCar.wheels[w];
    for (var c = 0; c < wg.children.length; c++) {
      if (c === 0) { // tire
        // Don't spin the cylinder (already rotated z=PI/2, spinning around local y visually spins treads... but spokes are the visible part)
      }
    }
  }
  // Simpler approach: rotate the whole wheel group around its local X
  // Actually the wheel group has rotation.y set for steering, so adding X rotation conflicts. 
  // We'll store a spin offset and apply to wheels.
  player._wheelSpin = (player._wheelSpin || 0) + wheelSpin;
  for (var w2 = 0; w2 < playerCar.wheels.length; w2++) {
    var wg2 = playerCar.wheels[w2];
    // rotate inner children except tire cylinder (visual spokes will spin)
    for (var ch = 1; ch < wg2.children.length; ch++) {
      wg2.children[ch].rotation.x = player._wheelSpin;
    }
  }

  // Fuel consumption
  if (Math.abs(player.speed) > 0.1 && !refueling) {
    player.fuel -= Math.abs(player.speed) * dt * 0.028;
    if (player.fuel < 0) player.fuel = 0;
  }

  // Headlights
  var lightsOnEffective = player.lightsOn || (worldTime < 6.5 || worldTime > 18.5);
  for (var h = 0; h < playerCar.headlights.length; h++) {
    var hl = playerCar.headlights[h];
    hl.material.emissiveIntensity = lightsOnEffective ? 1.0 : 0.2;
    hl.material.emissive.setHex(lightsOnEffective ? 0xffffdd : 0x444433);
  }

  // Brake lights
  var braking = input.brake && player.speed > 0.5;
  var brakeIntensity = braking ? 1.8 : 0.6;
  for (var tl = 0; tl < playerCar.taillights.length; tl++) {
    playerCar.taillights[tl].material.emissiveIntensity = brakeIntensity;
  }
  if (playerCar.highBrake) playerCar.highBrake.material.emissiveIntensity = brakeIntensity;

  // Turn signals
  updateTurnSignals(playerCar, player.steer, dt);

  // Refuel proximity
  needRefuel = false;
  var near = false;
  for (var g = 0; g < gasStations.length; g++) {
    var gs = gasStations[g];
    if (dist2D(player.pos.x, player.pos.z, gs.x, gs.z) < gs.radius) { near = true; break; }
  }
  if (near && player.fuel < player.maxFuel - 0.5 && !refueling && Math.abs(player.speed) < 1) {
    needRefuel = true;
    document.getElementById('refuel-prompt').style.display = 'block';
  } else if (!refueling) {
    document.getElementById('refuel-prompt').style.display = 'none';
  }

  // Exhaust smoke
  if (Math.random() < 0.4 && Math.abs(player.speed) > 1) {
    spawnParticle(
      player.pos.x - fx * (player.length/2 + 0.3),
      player.pos.y + 0.2,
      player.pos.z - fz * (player.length/2 + 0.3),
      0.5 + Math.random() * 0.3,
      0.5
    );
  }

  // Tire smoke during hard brake at speed
  if (input.brake && Math.abs(player.speed) > 8 && Math.random() < 0.6) {
    for (var s = -1; s <= 1; s += 2) {
      var rx = player.pos.x + Math.cos(player.angle) * s * (player.width/2 - 0.2) - fx * (player.length/2 - 1);
      var rz = player.pos.z - Math.sin(player.angle) * s * (player.width/2 - 0.2) - fz * (player.length/2 - 1);
      spawnParticle(rx, 0.15, rz, 0.7, 0.6, 0xdddddd);
    }
    // Skid marks
    if (Math.random() < 0.5) {
      addSkidMark(player.pos.x + Math.cos(player.angle) * (player.width/2 - 0.3),
                  player.pos.z - Math.sin(player.angle) * (player.width/2 - 0.3), player.angle);
      addSkidMark(player.pos.x - Math.cos(player.angle) * (player.width/2 - 0.3),
                  player.pos.z + Math.sin(player.angle) * (player.width/2 - 0.3), player.angle);
    }
  }
}

function updateTurnSignals(car, steer, dt) {
  if (!car || !car.signals) return;
  var blinkPhase = Math.floor(worldTime * 3600 * 1.2) % 2 === 0;
  if (car._signalBlink === undefined) car._signalBlink = true;
  car._signalBlink = !car._signalBlink;

  var leftOn = steer < -0.3;
  var rightOn = steer > 0.3;

  var lMat = leftOn && car._signalBlink ? MAT.signal : MAT.signalOff;
  var rMat = rightOn && car._signalBlink ? MAT.signal : MAT.signalOff;

  if (car.signals.frontL) {
    car.signals.frontL.material.color.copy(lMat.color);
    car.signals.frontL.material.emissive.copy(lMat.emissive);
    car.signals.frontL.material.emissiveIntensity = lMat.emissiveIntensity;
  }
  if (car.signals.rearL) {
    car.signals.rearL.material.color.copy(lMat.color);
    car.signals.rearL.material.emissive.copy(lMat.emissive);
    car.signals.rearL.material.emissiveIntensity = lMat.emissiveIntensity;
  }
  if (car.signals.frontR) {
    car.signals.frontR.material.color.copy(rMat.color);
    car.signals.frontR.material.emissive.copy(rMat.emissive);
    car.signals.frontR.material.emissiveIntensity = rMat.emissiveIntensity;
  }
  if (car.signals.rearR) {
    car.signals.rearR.material.color.copy(rMat.color);
    car.signals.rearR.material.emissive.copy(rMat.emissive);
    car.signals.rearR.material.emissiveIntensity = rMat.emissiveIntensity;
  }
}

function checkBuildingCollision(x, z, r) {
  for (var i = 0; i < buildingBoxes.length; i++) {
    var b = buildingBoxes[i];
    var cx = clamp(x, b.x1, b.x2);
    var cz = clamp(z, b.z1, b.z2);
    var dx = x - cx, dz = z - cz;
    if (dx*dx + dz*dz < r*r) return true;
  }
  return false;
}

/* ==========================================================================
   NPC CARS
   ========================================================================== */
function nodePos(i, j) {
  return new THREE.Vector3(ROAD_POS[i], 0, ROAD_POS[j]);
}

function pickNext(fromI, fromJ, prevI, prevJ) {
  var options = [];
  var di = fromI - prevI, dj = fromJ - prevJ;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (var d = 0; d < dirs.length; d++) {
    if (dirs[d][0] === -di && dirs[d][1] === -dj) continue;
    var ni = fromI + dirs[d][0];
    var nj = fromJ + dirs[d][1];
    if (ni < 0 || ni >= ROAD_POS.length || nj < 0 || nj >= ROAD_POS.length) continue;
    options.push({ i: ni, j: nj, straight: dirs[d][0] === di && dirs[d][1] === dj });
  }
  if (options.length === 0) return { i: prevI, j: prevJ };
  var straightOnes = options.filter(function(o){return o.straight;});
  if (straightOnes.length && Math.random() < 0.6) return straightOnes[0];
  return options[Math.floor(Math.random() * options.length)];
}

function createNPCCar() {
  var type = pick(NPC_CAR_TYPES);
  var color = pick(NPC_CAR_COLORS);
  var carData = buildCarMesh({ type: type, color: color, rimStyle: pick(['sport','classic','chrome']), spoiler: 'none' });

  var dirHorizontal = Math.random() < 0.5;
  var fi, fj, ti, tj;
  if (dirHorizontal) {
    fj = randi(0, ROAD_POS.length - 1);
    var dir = Math.random() < 0.5 ? 1 : -1;
    if (dir > 0) { fi = 0; ti = 1; } else { fi = ROAD_POS.length - 1; ti = ROAD_POS.length - 2; }
  } else {
    fi = randi(0, ROAD_POS.length - 1);
    var dir2 = Math.random() < 0.5 ? 1 : -1;
    if (dir2 > 0) { fj = 0; tj = 1; } else { fj = ROAD_POS.length - 1; tj = ROAD_POS.length - 2; }
  }

  var car = {
    data: carData,
    mesh: carData.group,
    fromI: fi, fromJ: fj, toI: ti, toJ: tj,
    prevI: fi, prevJ: fj,
    t: Math.random() * 0.7,
    speed: randRange(6, 10),
    baseSpeed: randRange(6, 10),
    pos: new THREE.Vector3(),
    angle: 0,
    wheelSpin: 0,
    lastTurning: 0
  };
  car.mesh.position.set(ROAD_POS[fi], 0.05, ROAD_POS[fj]);
  scene.add(car.mesh);
  return car;
}

function initNPCCars(count) {
  for (var i = 0; i < count; i++) npcCars.push(createNPCCar());
}

function updateNPCCars(dt) {
  for (var i = 0; i < npcCars.length; i++) {
    var car = npcCars[i];
    var from = nodePos(car.fromI, car.fromJ);
    var to = nodePos(car.toI, car.toJ);
    var len = from.distanceTo(to);
    if (len < 0.01) len = 0.01;

    var dirV = tmpVec.subVectors(to, from).normalize();
    var dirX = dirV.x, dirZ = dirV.z;
    var perpX = dirZ, perpZ = -dirX; // right side

    var travelAxis = Math.abs(dirX) > Math.abs(dirZ) ? 'x' : 'z';

    var canMove = true;
    var distToNode = (1 - car.t) * len;

    // Traffic light check
    if (distToNode < 10 && distToNode > 0.5) {
      var lightState = getLightForDir(travelAxis);
      if (lightState !== 'green') canMove = false;
    }

    // Pedestrian check
    for (var p = 0; p < pedestrians.length; p++) {
      var ped = pedestrians[p];
      if (ped.state !== 'CROSS') continue;
      var dxp = ped.x - car.pos.x;
      var dzp = ped.z - car.pos.z;
      var ahead = dxp * dirX + dzp * dirZ;
      if (ahead > 0 && ahead < 14) {
        var side = Math.abs(dxp * perpX + dzp * perpZ);
        if (side < 4.5) { canMove = false; break; }
      }
    }

    // NPC ahead
    var blockedAhead = false;
    for (var j = 0; j < npcCars.length; j++) {
      if (i === j) continue;
      var other = npcCars[j];
      var dxo = other.pos.x - car.pos.x;
      var dzo = other.pos.z - car.pos.z;
      var aheadO = dxo * dirX + dzo * dirZ;
      if (aheadO > 0 && aheadO < 7) {
        var sideO = Math.abs(dxo * perpX + dzo * perpZ);
        if (sideO < 2.6) { blockedAhead = true; break; }
      }
    }

    // Player
    var dxpl = player.pos.x - car.pos.x;
    var dzpl = player.pos.z - car.pos.z;
    var aheadPl = dxpl * dirX + dzpl * dirZ;
    if (aheadPl > 0 && aheadPl < 7) {
      var sidePl = Math.abs(dxpl * perpX + dzpl * perpZ);
      if (sidePl < 2.6) blockedAhead = true;
    }

    var targetSpeed = canMove && !blockedAhead ? car.baseSpeed : 0;
    car.speed += (targetSpeed - car.speed) * Math.min(1, 3.5 * dt);

    // Turning detection for signal
    var isTurning = false;
    var turnDir = 0;
    if (car.t > 0.9) {
      // Approaching intersection
      var nx = ROAD_POS[car.toI], nz = ROAD_POS[car.toJ];
      var prevDirX = ROAD_POS[car.fromI] - ROAD_POS[car.prevI];
      var prevDirZ = ROAD_POS[car.fromJ] - ROAD_POS[car.prevJ];
      var nextDirX = ROAD_POS[car.toI] - ROAD_POS[car.fromI];
      var nextDirZ = ROAD_POS[car.toJ] - ROAD_POS[car.fromJ];
      // Cross product
      var cross = prevDirX * nextDirZ - prevDirZ * nextDirX;
      if (Math.abs(cross) > 0.5) {
        isTurning = true;
        turnDir = cross > 0 ? -1 : 1;
      }
    }

    car.t += car.speed * dt / len;

    if (car.t >= 1) {
      car.t = 0;
      car.prevI = car.fromI;
      car.prevJ = car.fromJ;
      car.fromI = car.toI;
      car.fromJ = car.toJ;
      var next = pickNext(car.fromI, car.fromJ, car.prevI, car.prevJ);
      car.toI = next.i;
      car.toJ = next.j;
    }

    // Position with lane offset
    var px = from.x + (to.x - from.x) * car.t;
    var pz = from.z + (to.z - from.z) * car.t;
    var lx = px + perpX * 3;
    var lz = pz + perpZ * 3;

    // Avoid NPC overlap (resolve)
    for (var oi = 0; oi < npcCars.length; oi++) {
      if (oi === i) continue;
      var other2 = npcCars[oi];
      var dx2 = lx - other2.pos.x;
      var dz2 = lz - other2.pos.z;
      var dd2 = dx2*dx2 + dz2*dz2;
      if (dd2 < 4.0*4.0 && dd2 > 0.01) {
        var dist2 = Math.sqrt(dd2);
        var push = (4.0 - dist2) * 0.15;
        lx += (dx2/dist2) * push;
        lz += (dz2/dist2) * push;
      }
    }

    car.pos.set(lx, 0.05, lz);
    car.mesh.position.copy(car.pos);

    var newAngle = Math.atan2(dirX, dirZ);
    // Smooth angle
    var da = newAngle - car.angle;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    car.angle += da * Math.min(1, 6 * dt);
    car.mesh.rotation.y = car.angle;

    // Wheel spin
    car.wheelSpin += car.speed * dt * 2;
    for (var wi = 0; wi < car.data.wheels.length; wi++) {
      var wg = car.data.wheels[wi];
      for (var ch = 1; ch < wg.children.length; ch++) {
        wg.children[ch].rotation.x = car.wheelSpin;
      }
    }
    // Steering visual on NPC
    var steerVisual = isTurning ? turnDir * 0.4 : 0;
    for (var swi = 0; swi < car.data.steerWheels.length; swi++) {
      car.data.steerWheels[swi].rotation.y = steerVisual;
    }

    // Turn signals
    if (isTurning) {
      var blink = Math.floor(worldTime * 3600 * 1.5) % 2 === 0;
      var m = blink ? MAT.signal : MAT.signalOff;
      var targetSig = turnDir > 0 ? car.data.signals.rearR : car.data.signals.rearL;
      var targetSigF = turnDir > 0 ? car.data.signals.frontR : car.data.signals.frontL;
      if (targetSig) {
        targetSig.material.color.copy(m.color);
        targetSig.material.emissive.copy(m.emissive);
        targetSig.material.emissiveIntensity = m.emissiveIntensity;
      }
      if (targetSigF) {
        targetSigF.material.color.copy(m.color);
        targetSigF.material.emissive.copy(m.emissive);
        targetSigF.material.emissiveIntensity = m.emissiveIntensity;
      }
    } else {
      // Turn off
      ['frontL','frontR','rearL','rearR'].forEach(function(sigKey){
        var s = car.data.signals[sigKey];
        if (s) {
          s.material.color.copy(MAT.signalOff.color);
          s.material.emissive.copy(MAT.signalOff.emissive);
          s.material.emissiveIntensity = MAT.signalOff.emissiveIntensity;
        }
      });
    }

    // Brake lights for NPC
    var braking = car.speed < 0.5 && car.baseSpeed > 2;
    var bi = braking ? 1.8 : 0.6;
    for (var tl = 0; tl < car.data.taillights.length; tl++) {
      car.data.taillights[tl].material.emissiveIntensity = bi;
    }
    if (car.data.highBrake) car.data.highBrake.material.emissiveIntensity = bi;

    // Headlights at night
    var lightsOn = worldTime < 6.5 || worldTime > 18.5;
    for (var hl = 0; hl < car.data.headlights.length; hl++) {
      car.data.headlights[hl].material.emissiveIntensity = lightsOn ? 1.0 : 0.2;
    }
  }
}

/* ==========================================================================
   PEDESTRIANS
   ========================================================================== */
function blockCornerPos(bi, bj, corner) {
  var xw = ROAD_POS[bi] + SW_OFF;
  var xe = ROAD_POS[bi+1] - SW_OFF;
  var zn = ROAD_POS[bj] + SW_OFF;
  var zs = ROAD_POS[bj+1] - SW_OFF;
  if (corner === 0) return {x: xw, z: zn};
  if (corner === 1) return {x: xe, z: zn};
  if (corner === 2) return {x: xe, z: zs};
  return {x: xw, z: zs};
}

var CROSSINGS = [
  { corner:0, dir:'W', tBi:-1, tBj:0, tCorner:1 },
  { corner:0, dir:'N', tBi:0, tBj:-1, tCorner:3 },
  { corner:1, dir:'E', tBi:1, tBj:0, tCorner:0 },
  { corner:1, dir:'N', tBi:0, tBj:-1, tCorner:2 },
  { corner:2, dir:'E', tBi:1, tBj:0, tCorner:3 },
  { corner:2, dir:'S', tBi:0, tBj:1, tCorner:1 },
  { corner:3, dir:'W', tBi:-1, tBj:0, tCorner:2 },
  { corner:3, dir:'S', tBi:0, tBj:1, tCorner:0 }
];

function buildPedestrian(colorShirt, colorPants, heightScale) {
  var g = new THREE.Group();

  var skinMat = new THREE.MeshStandardMaterial({ color: pick([0xdba888, 0xba8866, 0x8a5a3a, 0xf0c8a0]),
    roughness: 0.85 });
  var shirtMat = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.8 });
  var pantsMat = new THREE.MeshStandardMaterial({ color: colorPants, roughness: 0.8 });

  // Head
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), skinMat);
  head.position.y = 1.5;
  g.add(head);
  // Hair
  var hair = new THREE.Mesh(new THREE.SphereGeometry(0.23, 10, 6, 0, Math.PI*2, 0, Math.PI*0.55),
    new THREE.MeshStandardMaterial({ color: pick([0x1a1a1a, 0x3a2010, 0x6b4a2a, 0xd4a850]),
      roughness: 0.9 }));
  hair.position.y = 1.52;
  g.add(hair);

  // Torso
  var torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.26), shirtMat);
  torso.position.y = 1.02;
  g.add(torso);

  // Arms (store refs for animation)
  var armL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.14), skinMat);
  armL.position.set(-0.3, 1.0, 0);
  var armLPivot = new THREE.Group();
  armLPivot.position.set(-0.3, 1.3, 0);
  armLPivot.add(armL);
  armL.position.set(0, -0.27, 0);
  g.add(armLPivot);

  var armR = armL.clone();
  var armRPivot = new THREE.Group();
  armRPivot.position.set(0.3, 1.3, 0);
  armR.position.set(0, -0.27, 0);
  armRPivot.add(armR);
  g.add(armRPivot);

  // Legs
  var legL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.2), pantsMat);
  var legLPivot = new THREE.Group();
  legLPivot.position.set(-0.11, 0.7, 0);
  legL.position.set(0, -0.35, 0);
  legLPivot.add(legL);
  g.add(legLPivot);

  var legR = legL.clone();
  var legRPivot = new THREE.Group();
  legRPivot.position.set(0.11, 0.7, 0);
  legR.position.set(0, -0.35, 0);
  legRPivot.add(legR);
  g.add(legRPivot);

  // Shoes
  var shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.1, 0.28),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
  shoeL.position.set(-0.11, 0.05, 0.03);
  g.add(shoeL);
  var shoeR = shoeL.clone();
  shoeR.position.x = 0.11;
  g.add(shoeR);

  g.scale.setScalar(heightScale);
  g.userData = { armL: armLPivot, armR: armRPivot, legL: legLPivot, legR: legRPivot };

  return g;
}

function createPedestrianAt(bi, bj, corner) {
  var shirtColors = [0xdd4444, 0x4477dd, 0xdddd44, 0x44dd44, 0xdd44dd, 0x44dddd, 0xffffff, 0xffaa44, 0x8844dd, 0x222222];
  var pantsColors = [0x333355, 0x222222, 0x554422, 0x333366, 0x663322, 0x1a1a1a];
  var h = randRange(0.9, 1.08);
  var mesh = buildPedestrian(pick(shirtColors), pick(pantsColors), h);
  scene.add(mesh);

  var pos = blockCornerPos(bi, bj, corner);
  var ped = {
    mesh: mesh,
    blockI: bi, blockJ: bj, corner: corner,
    x: pos.x, z: pos.z,
    nextCorner: (corner + 1) % 4,
    state: 'WALK',
    stateTime: 0,
    walkSpeed: randRange(1.0, 1.6),
    targetX: pos.x, targetZ: pos.z,
    crossFrom: null, crossTo: null,
    crossProgress: 0,
    crossBi: bi, crossBj: bj, crossCorner: corner,
    fallAngle: 0, hitSpeed: 0,
    waitTimeout: 0,
    walkPhase: Math.random() * 10
  };

  var nextPos = blockCornerPos(bi, bj, ped.nextCorner);
  ped.targetX = nextPos.x;
  ped.targetZ = nextPos.z;

  mesh.position.set(ped.x, 0.15, ped.z);
  pedestrians.push(ped);
}

function initPedestrians(count) {
  var gasBlocks = { '1_1':1, '3_1':1, '1_3':1, '3_3':1 };
  var placed = 0, guard = 0;
  while (placed < count && guard < 200) {
    guard++;
    var bi = randi(0, BLOCK_COUNT-1);
    var bj = randi(0, BLOCK_COUNT-1);
    if (gasBlocks[bi + '_' + bj]) continue;
    var c = randi(0, 3);
    createPedestrianAt(bi, bj, c);
    placed++;
  }
}

function isCrossingSafe(crossDir) {
  var t = worldTime % 1;
  if (crossDir === 'W' || crossDir === 'E') return t < 0.46;
  return t >= 0.46;
}

function updatePedestrians(dt) {
  for (var i = 0; i < pedestrians.length; i++) {
    var ped = pedestrians[i];
    ped.walkPhase += dt * 8;

    if (ped.state === 'WALK') {
      var dx = ped.targetX - ped.x;
      var dz = ped.targetZ - ped.z;
      var d = Math.sqrt(dx*dx + dz*dz);

      if (d < 0.2) {
        ped.corner = ped.nextCorner;
        ped.x = ped.targetX;
        ped.z = ped.targetZ;

        // Decide cross or continue
        var opts = CROSSINGS.filter(function(cr){ return cr.corner === ped.corner; });
        if (opts.length && Math.random() < 0.4) {
          var cr = opts[Math.floor(Math.random() * opts.length)];
          if (isCrossingSafe(cr.dir)) {
            var safe = true;
            for (var k = 0; k < npcCars.length; k++) {
              var nc = npcCars[k];
              if (dist2D(nc.pos.x, nc.pos.z, ped.x, ped.z) < 6) { safe = false; break; }
            }
            if (safe) {
              var targetPos = blockCornerPos(ped.blockI + cr.tBi, ped.blockJ + cr.tBj, cr.tCorner);
              ped.crossFrom = {x: ped.x, z: ped.z};
              ped.crossTo = targetPos;
              ped.crossBi = ped.blockI + cr.tBi;
              ped.crossBj = ped.blockJ + cr.tBj;
              ped.crossCorner = cr.tCorner;
              ped.crossProgress = 0;
              ped.state = 'CROSS';
              ped.stateTime = 0;
              continue;
            } else {
              ped.state = 'WAIT';
              ped.stateTime = 0;
              ped.waitTimeout = 3 + Math.random() * 3;
              continue;
            }
          } else {
            ped.state = 'WAIT';
            ped.stateTime = 0;
            ped.waitTimeout = 2 + Math.random() * 4;
            continue;
          }
        }

        ped.nextCorner = (ped.corner + 1) % 4;
        var np = blockCornerPos(ped.blockI, ped.blockJ, ped.nextCorner);
        ped.targetX = np.x;
        ped.targetZ = np.z;
      } else {
        var sp = ped.walkSpeed;
        ped.x += (dx/d) * sp * dt;
        ped.z += (dz/d) * sp * dt;
        ped.mesh.rotation.y = Math.atan2(dx, dz);

        // Walk animation
        var phase = ped.walkPhase;
        ped.mesh.userData.legL.rotation.x = Math.sin(phase) * 0.5;
        ped.mesh.userData.legR.rotation.x = -Math.sin(phase) * 0.5;
        ped.mesh.userData.armL.rotation.x = -Math.sin(phase) * 0.4;
        ped.mesh.userData.armR.rotation.x = Math.sin(phase) * 0.4;
      }
      ped.mesh.position.set(ped.x, 0.15 + Math.abs(Math.sin(ped.walkPhase)) * 0.04, ped.z);

    } else if (ped.state === 'WAIT') {
      ped.stateTime += dt;
      // Idle animation
      ped.mesh.userData.legL.rotation.x *= 0.9;
      ped.mesh.userData.legR.rotation.x *= 0.9;
      ped.mesh.userData.armL.rotation.x *= 0.9;
      ped.mesh.userData.armR.rotation.x *= 0.9;

      var opts2 = CROSSINGS.filter(function(cr){ return cr.corner === ped.corner; });
      if (opts2.length) {
        if (isCrossingSafe(opts2[0].dir)) {
          var safe2 = true;
          for (var k2 = 0; k2 < npcCars.length; k2++) {
            var nc2 = npcCars[k2];
            if (dist2D(nc2.pos.x, nc2.pos.z, ped.x, ped.z) < 6) { safe2 = false; break; }
          }
          if (safe2) {
            var cr2 = opts2[Math.floor(Math.random() * opts2.length)];
            var tp2 = blockCornerPos(ped.blockI + cr2.tBi, ped.blockJ + cr2.tBj, cr2.tCorner);
            ped.crossFrom = {x: ped.x, z: ped.z};
            ped.crossTo = tp2;
            ped.crossBi = ped.blockI + cr2.tBi;
            ped.crossBj = ped.blockJ + cr2.tBj;
            ped.crossCorner = cr2.tCorner;
            ped.crossProgress = 0;
            ped.state = 'CROSS';
            ped.stateTime = 0;
          }
        }
      }
      if (ped.stateTime > ped.waitTimeout && ped.state === 'WAIT') {
        ped.state = 'WALK';
        ped.nextCorner = (ped.corner + 1) % 4;
        var np2 = blockCornerPos(ped.blockI, ped.blockJ, ped.nextCorner);
        ped.targetX = np2.x;
        ped.targetZ = np2.z;
      }

    } else if (ped.state === 'CROSS') {
      var cdx = ped.crossTo.x - ped.crossFrom.x;
      var cdz = ped.crossTo.z - ped.crossFrom.z;
      var crossDist = Math.sqrt(cdx*cdx + cdz*cdz);
      if (crossDist < 0.01) crossDist = 0.01;
      ped.crossProgress += (ped.walkSpeed * 1.6 * dt) / crossDist;

      if (ped.crossProgress >= 1) {
        ped.x = ped.crossTo.x;
        ped.z = ped.crossTo.z;
        ped.blockI = ped.crossBi;
        ped.blockJ = ped.crossBj;
        ped.corner = ped.crossCorner;
        ped.state = 'WALK';
        ped.nextCorner = (ped.corner + 1) % 4;
        var np3 = blockCornerPos(ped.blockI, ped.blockJ, ped.nextCorner);
        ped.targetX = np3.x;
        ped.targetZ = np3.z;
      } else {
        ped.x = ped.crossFrom.x + cdx * ped.crossProgress;
        ped.z = ped.crossFrom.z + cdz * ped.crossProgress;
        ped.mesh.rotation.y = Math.atan2(cdx, cdz);
        // Walk animation
        var phase2 = ped.walkPhase;
        ped.mesh.userData.legL.rotation.x = Math.sin(phase2) * 0.5;
        ped.mesh.userData.legR.rotation.x = -Math.sin(phase2) * 0.5;
        ped.mesh.userData.armL.rotation.x = -Math.sin(phase2) * 0.4;
        ped.mesh.userData.armR.rotation.x = Math.sin(phase2) * 0.4;
      }
      ped.mesh.position.set(ped.x, 0.15 + Math.abs(Math.sin(ped.walkPhase)) * 0.04, ped.z);

    } else if (ped.state === 'FALL') {
      ped.stateTime += dt;
      var fallT = Math.min(1, ped.stateTime / 0.6);
      ped.mesh.rotation.z = fallT * Math.PI/2;
      ped.mesh.position.y = 0.15 - fallT * 0.25;
      if (ped.stateTime > 0.7) {
        ped.state = 'DOWN';
        ped.stateTime = 0;
      }

    } else if (ped.state === 'DOWN') {
      ped.stateTime += dt;
      ped.mesh.rotation.z = Math.PI/2;
      ped.mesh.position.y = -0.1;
      if (ped.stateTime > 3.5) {
        ped.state = 'RECOVER';
        ped.stateTime = 0;
      }

    } else if (ped.state === 'RECOVER') {
      ped.stateTime += dt;
      var rt = Math.min(1, ped.stateTime / 0.8);
      ped.mesh.rotation.z = (1 - rt) * Math.PI/2;
      ped.mesh.position.y = -0.1 + rt * 0.25;
      if (rt >= 1) {
        ped.mesh.rotation.z = 0;
        // Find nearest sidewalk corner
        var bestD = Infinity, bestC = null;
        for (var bbi = 0; bbi < BLOCK_COUNT; bbi++) {
          for (var bbj = 0; bbj < BLOCK_COUNT; bbj++) {
            for (var bc = 0; bc < 4; bc++) {
              var cp = blockCornerPos(bbi, bbj, bc);
              var dd = dist2D(cp.x, cp.z, ped.x, ped.z);
              if (dd < bestD) { bestD = dd; bestC = {bi:bbi, bj:bbj, c:bc, x:cp.x, z:cp.z}; }
            }
          }
        }
        if (bestC) {
          ped.blockI = bestC.bi;
          ped.blockJ = bestC.bj;
          ped.corner = bestC.c;
          ped.x = bestC.x;
          ped.z = bestC.z;
          ped.nextCorner = (ped.corner + 1) % 4;
          var np4 = blockCornerPos(ped.blockI, ped.blockJ, ped.nextCorner);
          ped.targetX = np4.x;
          ped.targetZ = np4.z;
        }
        ped.mesh.position.set(ped.x, 0.15, ped.z);
        ped.state = 'WALK';
        ped.stateTime = 0;
      }
    }
  }
}

/* ==========================================================================
   PARTICLES
   ========================================================================== */
var particleGeo = new THREE.PlaneGeometry(0.5, 0.5);
function spawnParticle(x, y, z, life, size, color) {
  if (particles.length >= maxParticles) {
    var old = particles.shift();
    scene.remove(old.mesh);
    old.mesh.material.dispose();
  }
  var mat = new THREE.MeshBasicMaterial({
    color: color !== undefined ? color : 0x888888,
    transparent: true, opacity: 0.6, depthWrite: false
  });
  var m = new THREE.Mesh(particleGeo, mat);
  m.position.set(x, y, z);
  m.scale.setScalar(size);
  m.renderOrder = 5;
  scene.add(m);
  particles.push({ mesh: m, life: life, maxLife: life, vy: 0.5 + Math.random() * 0.5 });
}

function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.material.opacity = (p.life / p.maxLife) * 0.5;
    p.mesh.scale.multiplyScalar(1 + dt * 1.5);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }
  // Limit
  while (particles.length > maxParticles) {
    var old = particles.shift();
    scene.remove(old.mesh);
    old.mesh.material.dispose();
  }
}

var skidGeo = new THREE.PlaneGeometry(0.35, 0.8);
var skidMat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.6, depthWrite: false });
function addSkidMark(x, z, angle) {
  if (skidMarks.length >= maxSkids) {
    var old = skidMarks.shift();
    scene.remove(old);
  }
  var m = new THREE.Mesh(skidGeo, skidMat);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = -angle;
  m.position.set(x, 0.055, z);
  m.renderOrder = 2;
  scene.add(m);
  skidMarks.push(m);
}

var SKY_KEYS = [
  { t: 0,    sky: 0x08101e, fog: 0x08101e, sun: 0x223355, sunI: 0.05, ambI: 0.15, hemiI: 0.15, exp: 0.5 },
  { t: 5,    sky: 0x1a2035, fog: 0x1a2035, sun: 0x556688, sunI: 0.15, ambI: 0.2,  hemiI: 0.25, exp: 0.7 },
  { t: 6.5,  sky: 0xe8a070, fog: 0xd8a888, sun: 0xffaa66, sunI: 0.7,  ambI: 0.4,  hemiI: 0.5,  exp: 0.95 },
  { t: 9,    sky: 0x87c8e8, fog: 0x9ec8e0, sun: 0xffeecc, sunI: 1.0,  ambI: 0.5,  hemiI: 0.6,  exp: 1.0 },
  { t: 13,   sky: 0x87c8e8, fog: 0xaad4ea, sun: 0xffffff, sunI: 1.15, ambI: 0.55, hemiI: 0.65, exp: 1.05 },
  { t: 17,   sky: 0xe89858, fog: 0xd8b090, sun: 0xffaa66, sunI: 0.8,  ambI: 0.45, hemiI: 0.5,  exp: 0.95 },
  { t: 19,   sky: 0xc05838, fog: 0xb06848, sun: 0xff6633, sunI: 0.4,  ambI: 0.3,  hemiI: 0.35, exp: 0.85 },
  { t: 20.5, sky: 0x1a1830, fog: 0x1a1830, sun: 0x443355, sunI: 0.1,  ambI: 0.18, hemiI: 0.2,  exp: 0.6 },
  { t: 24,   sky: 0x08101e, fog: 0x08101e, sun: 0x223355, sunI: 0.05, ambI: 0.15, hemiI: 0.15, exp: 0.5 }
];

function getSkyKey(hour) {
  for (var i = 0; i < SKY_KEYS.length - 1; i++) {
    if (hour >= SKY_KEYS[i].t && hour <= SKY_KEYS[i+1].t) {
      var a = SKY_KEYS[i], b = SKY_KEYS[i+1];
      var t = (hour - a.t) / (b.t - a.t);
      return {
        sky: colorLerp(a.sky, b.sky, t),
        fog: colorLerp(a.fog, b.fog, t),
        sun: colorLerp(a.sun, b.sun, t),
        sunI: lerp(a.sunI, b.sunI, t),
        ambI: lerp(a.ambI, b.ambI, t),
        hemiI: lerp(a.hemiI, b.hemiI, t),
        exp: lerp(a.exp, b.exp, t)
      };
    }
  }
  return SKY_KEYS[0];
}

function updateDayNight() {
  var h = worldTime % 24;
  var key = getSkyKey(h);

  scene.background.setHex(key.sky);
  scene.fog.color.setHex(key.fog);

  var sun = scene.userData.sun;
  if (sun) {
    sun.color.setHex(key.sun);
    sun.intensity = key.sunI;
    // Position sun based on hour (arc across sky)
    var angle = ((h - 6) / 12) * Math.PI; // 6am at east, 6pm at west
    sun.position.set(Math.cos(-angle) * 150, Math.max(10, Math.sin(angle) * 150), 60);
  }

  if (scene.userData.amb) scene.userData.amb.intensity = key.ambI;
  if (scene.userData.hemi) scene.userData.hemi.intensity = key.hemiI;

  renderer.toneMappingExposure = key.exp;

  // Toggle street lamps
  var lightsOn = h < 6.5 || h > 18.5;
  var emissive = lightsOn ? 1.0 : 0.0;
  for (var i = 0; i < streetLights.length; i++) {
    var sl = streetLights[i];
    if (sl.bulb) sl.bulb.material.emissiveIntensity = emissive * 0.8;
    if (sl.light) sl.light.intensity = emissive * 0.6;
  }
}

/* ==========================================================================
   CAMERA
   ========================================================================== */
var cameraShake = 0;
function triggerCameraShake(amount) {
  cameraShake = Math.max(cameraShake, amount);
}

var camState = {
  baseDist: 9.5,
  baseHeight: 4.6,
  fovBase: 62,
  fovTarget: 62,
  distOffset: 0,
  tilt: 0
};

function updateCamera(dt) {
  if (!playerCar) return;

  // Compute dynamic distance / FOV / tilt
  var speedNorm = Math.abs(player.speed) / 25;
  var accel = input.gas && Math.abs(player.speed) > 1 ? 1 : 0;
  var brake = input.brake && Math.abs(player.speed) > 2 ? 1 : 0;

  camState.distOffset += ((accel * 1.5 - brake * 1.2) - camState.distOffset) * Math.min(1, 4 * dt);
  camState.fovTarget = camState.fovBase + speedNorm * 10 - brake * 2;
  camera.fov += (camState.fovTarget - camera.fov) * Math.min(1, 5 * dt);
  camera.updateProjectionMatrix();

  camState.tilt += ((-player.steer * 0.06 * speedNorm) - camState.tilt) * Math.min(1, 5 * dt);

  var camDist = camState.baseDist + camState.distOffset;
  var camHeight = camState.baseHeight + Math.abs(player.speed) * 0.05;

  var fx = Math.sin(player.angle);
  var fz = Math.cos(player.angle);

  var targetX = player.pos.x - fx * camDist;
  var targetZ = player.pos.z - fz * camDist;

  // Camera shake
  if (cameraShake > 0) {
    targetX += (Math.random() - 0.5) * cameraShake * 3;
    targetZ += (Math.random() - 0.5) * cameraShake * 3;
    cameraShake = Math.max(0, cameraShake - dt * 2);
  }

  var lerpFactor = 1 - Math.exp(-6 * dt);
  camera.position.x += (targetX - camera.position.x) * lerpFactor;
  camera.position.z += (targetZ - camera.position.z) * lerpFactor;
  camera.position.y += (camHeight - camera.position.y) * lerpFactor;

  // Look target with slight tilt via roll
  var lookX = player.pos.x + fx * 5;
  var lookZ = player.pos.z + fz * 5;

  camera.up.set(Math.sin(camState.tilt), 1, 0).normalize();
  camera.lookAt(lookX, 1.8, lookZ);
}

/* ==========================================================================
   AUDIO
   ========================================================================== */
function initAudio() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();

    // Engine sound: two oscillators (base + harmonic) through a filter
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;

    var engineOsc2 = audioCtx.createOscillator();
    engineOsc2.type = 'square';
    engineOsc2.frequency.value = 90;

    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.0;

    engineOsc.connect(filter);
    engineOsc2.connect(filter);
    filter.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc.start();
    engineOsc2.start();

    engineOsc._osc2 = engineOsc2;
  } catch(e) { audioCtx = null; }
}

function updateAudio() {
  if (!audioCtx || !engineGain || audioMuted) {
    if (engineGain && audioMuted) engineGain.gain.value = 0;
    return;
  }
  var rpm = Math.abs(player.speed) / 25;
  var vol = 0.03 + rpm * 0.08;
  if (input.gas) vol += 0.03;
  engineGain.gain.value = Math.min(0.12, vol);

  var baseFreq = 55 + rpm * 180;
  engineOsc.frequency.value = baseFreq;
  if (engineOsc._osc2) engineOsc._osc2.frequency.value = baseFreq * 1.5;
}

function playHorn() {
  if (!audioCtx || audioMuted) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = 400;
    g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

function setupInput() {
  if (setupInput._done) return;
  setupInput._done = true;
  function bind(btn, key) {
    if (!btn) return;
    var on = function(e){
      e.preventDefault();
      input[key] = true;
      btn.classList.add('active');
      if (e.pointerId !== undefined && btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch(_){} }
    };
    var off = function(e){
      if (e) e.preventDefault();
      input[key] = false;
      btn.classList.remove('active');
      if (e && e.pointerId !== undefined && btn.releasePointerCapture) { try { btn.releasePointerCapture(e.pointerId); } catch(_){} }
    };
    btn.addEventListener('pointerdown', on, {passive:false});
    btn.addEventListener('pointerup', off, {passive:false});
    btn.addEventListener('pointercancel', off, {passive:false});
    btn.addEventListener('lostpointercapture', off, {passive:false});
    btn.addEventListener('pointerleave', function(e){ if (e.buttons === 0) off(e); }, {passive:false});
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  bind(document.getElementById('btn-gas'), 'gas');
  bind(document.getElementById('btn-brake'), 'brake');
  bind(document.getElementById('btn-left'), 'left');
  bind(document.getElementById('btn-right'), 'right');

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') { input.gas = true; e.preventDefault(); }
    if (k === 's' || k === 'arrowdown') { input.brake = true; e.preventDefault(); }
    if (k === 'a' || k === 'arrowleft') { input.left = true; e.preventDefault(); }
    if (k === 'd' || k === 'arrowright') { input.right = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') input.gas = false;
    if (k === 's' || k === 'arrowdown') input.brake = false;
    if (k === 'a' || k === 'arrowleft') input.left = false;
    if (k === 'd' || k === 'arrowright') input.right = false;
  });

  // Color picker
  var picker = document.getElementById('color-picker');
  COLORS.forEach(function(c){
    var sw = document.createElement('div');
    sw.className = 'cp-swatch';
    sw.style.background = '#' + c.hex.toString(16).padStart(6,'0');
    if (c.hex === player.colorHex) sw.classList.add('selected');
    sw.addEventListener('click', function(){
      player.colorHex = c.hex;
      if (playerCar) playerCar.bodyMat.color.setHex(c.hex);
      picker.querySelectorAll('.cp-swatch').forEach(function(e){ e.classList.remove('selected'); });
      sw.classList.add('selected');
      showToast('Warna: ' + c.name);
    });
    picker.appendChild(sw);
  });

  document.getElementById('btn-color').addEventListener('click', function(){
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
  });

  document.getElementById('btn-light').addEventListener('click', function(){
    player.lightsOn = !player.lightsOn;
    this.classList.toggle('active', player.lightsOn);
    showToast(player.lightsOn ? 'Lampu ON' : 'Lampu OFF');
  });

  document.getElementById('btn-horn').addEventListener('click', function(){
    playHorn();
  });

  document.getElementById('btn-mute').addEventListener('click', function(){
    audioMuted = !audioMuted;
    this.classList.toggle('active', !audioMuted);
    showToast(audioMuted ? 'Suara OFF' : 'Suara ON');
  });

  document.getElementById('btn-fullscreen').addEventListener('click', function(){
    try {
      if (!document.fullscreenElement) {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch(e) {}
  });

  document.getElementById('btn-refuel').addEventListener('click', function(){
    if (!needRefuel || refueling) return;
    refueling = true;
    refuelProgress = 0;
    refuelCost = 0;
    player.speed = 0;
    document.getElementById('refuel-prompt').style.display = 'none';
    document.getElementById('refuel-hud').style.display = 'block';
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

function updateRefueling(dt) {
  if (!refueling) return;
  var needed = player.maxFuel - player.fuel;
  var rate = 25 * dt;
  player.fuel = Math.min(player.maxFuel, player.fuel + rate);
  refuelCost += rate * 50;
  refuelProgress = 1 - (player.maxFuel - player.fuel) / needed;

  document.getElementById('refuel-bar-fill').style.width = (refuelProgress * 100) + '%';
  document.getElementById('refuel-cost').textContent = 'Rp ' + Math.floor(refuelCost).toLocaleString('id-ID');

  if (player.fuel >= player.maxFuel - 0.2) {
    refueling = false;
    player.fuel = player.maxFuel;
    document.getElementById('refuel-hud').style.display = 'none';
    showToast('Tangki penuh! Rp ' + Math.floor(refuelCost).toLocaleString('id-ID'));
  }
}

var PERF={enabled:true,targetFPS:30,minPixelRatio:0.65,maxPixelRatio:1.0,currentPixelRatio:1.0,fps:30,samples:0,sampleTime:0,npcAcc:0,pedAcc:0,trafficAcc:0,particleAcc:0,dayAcc:0,hudAcc:0,audioAcc:0};
function initPerformance(){if(!renderer)return;PERF.currentPixelRatio=Math.min(window.devicePixelRatio||1,1.0);renderer.setPixelRatio(PERF.currentPixelRatio);}
function performanceTick(dt){if(!PERF.enabled)return;PERF.samples++;PERF.sampleTime+=dt;if(PERF.sampleTime<1)return;var fps=PERF.samples/PERF.sampleTime;PERF.fps=fps;PERF.samples=0;PERF.sampleTime=0;var pr=PERF.currentPixelRatio;if(fps<25)pr=Math.max(PERF.minPixelRatio,pr-.10);else if(fps<29)pr=Math.max(PERF.minPixelRatio,pr-.05);else if(fps>42)pr=Math.min(PERF.maxPixelRatio,pr+.05);if(Math.abs(pr-PERF.currentPixelRatio)>=.01){PERF.currentPixelRatio=pr;renderer.setPixelRatio(pr);renderer.setSize(window.innerWidth,window.innerHeight,false);}}
function perfUpdateNPC(dt){PERF.npcAcc+=dt;var x=PERF.fps<27?.075:(PERF.fps<34?.055:.033);if(PERF.npcAcc>=x){var d=Math.min(PERF.npcAcc,.12);PERF.npcAcc=0;updateNPCCars(d);}}
function perfUpdatePeds(dt){PERF.pedAcc+=dt;var x=PERF.fps<27?.12:(PERF.fps<34?.085:.05);if(PERF.pedAcc>=x){var d=Math.min(PERF.pedAcc,.16);PERF.pedAcc=0;updatePedestrians(d);}}
function perfUpdateTraffic(dt){PERF.trafficAcc+=dt;if(PERF.trafficAcc>=(PERF.fps<30?.10:.05)){PERF.trafficAcc=0;updateTrafficLights();}}
function perfUpdateParticles(dt){PERF.particleAcc+=dt;if(PERF.particleAcc>=(PERF.fps<30?.05:.033)){var d=Math.min(PERF.particleAcc,.08);PERF.particleAcc=0;updateParticles(d);}}
function perfUpdateDay(dt){PERF.dayAcc+=dt;if(PERF.dayAcc>=.08){PERF.dayAcc=0;updateDayNight();}}
function perfUpdateHUD(dt){PERF.hudAcc+=dt;if(PERF.hudAcc>=.08){PERF.hudAcc=0;updateHUD();}}
function perfUpdateAudio(dt){PERF.audioAcc+=dt;if(PERF.audioAcc>=.05){PERF.audioAcc=0;updateAudio();}}

var lastTime = 0;
function gameLoop(now) {
  if (!gameRunning) return;
  requestAnimationFrame(gameLoop);

  var dt = Math.min(0.05, (now - lastTime)/1000 || 0.016);
  lastTime = now;

  worldTime += dt * (24 / DAY_CYCLE_SECONDS);
  if (worldTime >= 24) worldTime -= 24;

  updatePlayer(dt);
  updateRefueling(dt);
  perfUpdateNPC(dt);
  perfUpdatePeds(dt);
  perfUpdateTraffic(dt);
  perfUpdateParticles(dt);
  perfUpdateDay(dt);
  updateCamera(dt);
  perfUpdateHUD(dt);
  perfUpdateAudio(dt);
  performanceTick(dt);

  renderer.render(scene, camera);
}

function initGame() {
  initMaterials();
  setupInput();
  setupScene();
  initPerformance();
  createGround();
  createRoads();
  createSidewalks();
  createMarkings();
  createBuildings();
  createTrees();
  createStreetLamps();
  createProps();
  createTrafficLights();
  createGasStations();
  setupPlayer();
  initNPCCars(16);
  initPedestrians(16);

  camera.position.set(
    player.pos.x - Math.sin(player.angle) * 10,
    5,
    player.pos.z - Math.cos(player.angle) * 10
  );
  camera.lookAt(player.pos.x, 1.5, player.pos.z);

  updateDayNight();
}

function startGame() {
  try {
    initGame();
    document.getElementById('garage').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    checkOrientation();

    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch(err) {
    var ov = document.getElementById('err');
    ov.style.display = 'block';
    ov.textContent = 'START ERROR: ' + err.message + '\n\n' + (err.stack || '');
    console.error(err);
  }
}

function startGarage() {
  try {
    document.getElementById('boot').style.display = 'none';
    document.getElementById('garage').style.display = 'flex';
    if (!garageScene) {
      setupGarage();
      garageLastTime = performance.now();
      requestAnimationFrame(garageLoop);
    }
    onResizeGarage();
  } catch(err) {
    var ov = document.getElementById('err');
    ov.style.display = 'block';
    ov.textContent = 'GARAGE ERROR: ' + err.message + '\n\n' + (err.stack || '');
    console.error(err);
  }
}

function onResizeGarage() {
  if (!garageRenderer || !garageCamera) return;
  garageCamera.aspect = window.innerWidth / window.innerHeight;
  garageCamera.updateProjectionMatrix();
  garageRenderer.setSize(window.innerWidth, window.innerHeight);
}

document.addEventListener('DOMContentLoaded', function(){
  checkOrientation();
  window.addEventListener('resize', function(){
    checkOrientation();
    onResizeGarage();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){
      checkOrientation();
      onResizeGarage();
    }, 220);
  });

  var toGarage = document.getElementById('to-garage');
  var startHandler = function(e){
    e.preventDefault();
    if (toGarage._started) return;
    toGarage._started = true;
    try { initAudio(); } catch(er){}
    startGarage();
  };
  toGarage.addEventListener('click', startHandler);
  toGarage.addEventListener('touchend', startHandler, {passive:false});

  var driveBtn = document.getElementById('drive-btn');
  var driveHandler = function(e){
    e.preventDefault();
    if (driveBtn._started) return;
    driveBtn._started = true;
    startGame();
  };
  driveBtn.addEventListener('click', driveHandler);
  driveBtn.addEventListener('touchend', driveHandler, {passive:false});
});

})();
</script>
</body>
</html>
